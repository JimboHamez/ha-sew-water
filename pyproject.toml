[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["ANN", "B", "D", "E", "F", "I", "N", "UP", "W"]
# ANN401: raw JSON payloads and config-flow user_input are idiomatically Any in Home Assistant.
ignore = ["ANN401", "D107", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["custom_components.sew_water", "sew_client"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
follow_imports = "silent"

[tool.pytest.ini_options]
# CI disables the logging plugin; keep local runs identical so caplog-dependent tests cannot slip through.
addopts = "-p no:logging"
asyncio_mode = "auto"
testpaths = ["tests"]

[[tool.mypy.overrides]]
# Home Assistant re-exports helpers such as recorder.get_instance without listing them in __all__.
module = ["homeassistant.*"]
implicit_reexport = true
