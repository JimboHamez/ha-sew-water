name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Jobs only check out the repo and install from PyPI; none writes back to it.
permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: Run tests
        # Client tests are offline (aioresponses); the tests/ha suite runs against the Home Assistant
        # that pytest-homeassistant-custom-component pulls in. Home Assistant 2026.10 needs Python 3.14, so on
        # 3.13 pip would quietly resolve an older release. Silver requires >= 95% coverage.
        run: pytest -q -p no:logging --cov=custom_components/sew_water --cov-report=term-missing --cov-fail-under=95

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install ruff
        run: pip install -r requirements_test.txt
      - name: Format check
        run: ruff format --check custom_components tests
      - name: Lint
        run: ruff check custom_components tests

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        # Home Assistant is installed so mypy can resolve the framework imports.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
          pip install "homeassistant>=2025.8" mypy
      - name: Type check (component only)
        # Strict config lives in pyproject.toml [tool.mypy]; scoped to the integration package.
        run: mypy custom_components/sew_water
