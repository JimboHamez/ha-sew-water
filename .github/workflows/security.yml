name: Security

# Report-only security scanning. None of these jobs fail the build — they
# publish findings to the repo's Security tab (Code scanning) and/or job logs
# so they can be triaged without blocking PRs. Flip the per-tool exit codes /
# fail-build flags noted below once the baseline is clean to make them gating.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly re-scan so newly disclosed CVEs surface even without a push.
    - cron: "0 0 * * 1"

# Read-only by default. The jobs that upload SARIF to the Security tab add
# `security-events: write` for themselves.
permissions:
  contents: read

jobs:
  # --- SAST -----------------------------------------------------------------
  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install Semgrep
        run: pip install semgrep
      - name: Scan
        # --error is omitted, so a finding never fails the job (report-only).
        run: |
          semgrep scan \
            --sarif --output semgrep.sarif \
            --config p/python \
            --config p/security-audit \
            --config p/secrets \
            --config p/github-actions
      - name: Upload SARIF
        # Fork PRs get a read-only token that can't upload, so they skip this step.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # --- Secret scanning ------------------------------------------------------
  gitleaks:
    name: Gitleaks (secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history so the whole git log is scanned
      # The archive is checked against its published checksum, so a replaced download fails here instead of running.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan
        # --exit-code 0 keeps it report-only; --redact avoids printing secrets.
        run: |
          gitleaks detect \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 0
      - name: Upload SARIF
        # Fork PRs get a read-only token that can't upload, so they skip this step.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # --- Filesystem: vulns + secrets + misconfig ------------------------------
  trivy:
    name: Trivy (fs)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Scan
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master (2026-10-21)
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif
          exit-code: "0" # report-only
      - name: Upload SARIF
        # Fork PRs get a read-only token that can't upload, so they skip this step.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy

  # --- Dependency vulnerabilities -------------------------------------------
  grype:
    name: Grype (dep CVEs)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Scan
        id: scan
        uses: anchore/scan-action@869c549e657a088dc0441b08ce4fc0ecdac2bb65 # v5.3.0
        with:
          path: "."
          fail-build: false # report-only
          output-format: sarif
      - name: Upload SARIF
        # Fork PRs get a read-only token that can't upload, so they skip this step.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype

  # --- SBOM (dependency inventory) ------------------------------------------
  syft:
    name: Syft (SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: "."
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          # Attaches the SBOM as a build artifact (default behaviour).
          upload-artifact: true
