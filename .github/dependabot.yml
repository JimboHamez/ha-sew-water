version: 2

updates:
  # Workflow actions are pinned to commit SHAs. Dependabot bumps the SHA and the version comment beside it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR per week for all action bumps instead of one per action.
      github-actions:
        patterns:
          - "*"

  # Test and lint dependencies in requirements_test.txt. The integration bundles its client, so manifest.json has none.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-test-deps:
        patterns:
          - "*"
